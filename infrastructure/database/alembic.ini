# Alembic configuration (doc 05 §21, closing the "no migration policy" S3 gap).
#
# The database URL comes from the DATABASE_URL environment variable, set in
# env.py — never committed here, because a URL in a config file is a credential
# in a config file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../../apps/api
path_separator = os

# Timestamped, sortable revision filenames. The default random hex tells a reader
# nothing about order, which matters when reviewing a migration in a diff.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
