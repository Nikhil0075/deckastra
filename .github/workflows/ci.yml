# CI (doc 05 §36).
#
# The gates that exist today are the ones Phase 0 can actually enforce. Visual
# regression, agent contract tests and E2E join as the phases that produce them
# land — each one added with its phase, never as a retrofit, because a gate added
# after the fact starts life red and gets disabled.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The desktop candidate is also built on demand: packaging takes minutes and
  # produces a 250MB artifact, which is worth it before a release and not on
  # every push.
  workflow_dispatch:
    inputs:
      package:
        description: Build an unsigned installer as well
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Includes the visual-regression gate: the three seed decks' resolved
      # scenes are compared against committed digests in
      # packages/renderer/baselines/. UPDATE_BASELINES is deliberately not set
      # here — a baseline that regenerates in CI is not a gate.
      - name: Unit tests
        run: npm test

      # A production build is the only thing that exercises the app's module
      # resolution and server/client boundary; the unit tests do not.
      - name: Web build
        run: npm run build --workspace @deckastra/web

      # The generated JSON Schema is committed so the Python service and external
      # tooling can consume it without running the TypeScript build. That only
      # works if it is never stale, which is what this gate enforces.
      - name: JSON Schema is not stale
        run: npm run schema:drift

      # A preset is public authoring API. Validate its named slots, prove each
      # validator family with a negative control, and keep the human review
      # contact sheet in sync with the source catalog. Exporting every template
      # needs Python and Chromium, so that half runs in the Export job.
      - name: Deck preset catalog and review sheet
        run: npm run presets:catalog

      # Fixtures are generated from the schema too. A drifted fixture would make
      # every downstream test assert against a document shape that no longer exists.
      - name: Fixtures are not stale
        run: |
          npm run fixtures:build --workspace @deckastra/presentation-schema
          git diff --exit-code -- packages/presentation-schema/fixtures \
            || (echo "::error::Fixtures are stale. Run the fixture build and commit the result." && exit 1)

  # Real Chromium, so it catches what the scene digest structurally cannot: a bug
  # confined to the emit step or to the browser's painting of it. Separate from
  # the TypeScript job because it needs a browser download, and the fast gate
  # should stay fast.
  pixels:
    name: Pixel regression
    runs-on: ubuntu-latest
    # The reviewed Linux baseline uses this exact browser, OS and font image.
    # Upgrade Playwright and this digest together, then inspect all PNGs.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --shm-size=512m
    steps:
      - uses: actions/checkout@v4
      - run: npm ci

      # Enforces the determinism properties: identical PNGs twice, identical
      # after a reload, and a negative control proving the gate can see a change.
      #
      # Missing or changed baselines fail. Never update expected hashes in CI.
      - name: Pixel determinism and baselines
        run: |
          PIXELS=1 REQUIRE_PIXEL_BASELINE=1 npm run test:pixels --workspace @deckastra/renderer

      - name: Pixel review evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-review
          path: |
            packages/renderer/baselines/pixels/*.computed
            packages/renderer/baselines/pixels/artifacts/
          if-no-files-found: ignore

  # The database the product actually deploys on. The schema is not
  # dialect-neutral — `JsonColumn` resolves to JSONB here and to JSON everywhere
  # else — so a migration that has only ever run on SQLite is a migration that
  # has not been tested. This is where that stops being true.
  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        # The same image as the compose file, so CI and local development are
        # testing the same engine.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: deckastra
          POSTGRES_PASSWORD: deckastra_local
          POSTGRES_DB: deckastra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deckastra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements-dev.txt -r apps/api/requirements.txt pytest

      # The whole API suite, not just the PostgreSQL-specific file: everything
      # that touches the store should be exercised against the real engine, and
      # the tests that do not care are cheap.
      # Includes the story-checkpoint tests, which need a durable LangGraph
      # checkpointer and therefore only run here. A pause that cannot be resumed
      # in another process is not a pause.
      - name: API tests against PostgreSQL
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://deckastra:deckastra_local@localhost:5432/deckastra
        run: python -m pytest apps/api -q

  cross-language:
    name: Schema contract (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: npm ci
      - run: pip install -r requirements-dev.txt -r apps/api/requirements.txt pytest

      # Regenerate rather than trusting the committed artifact: this job's whole
      # purpose is to prove the Python side and the Zod definitions agree right
      # now, and reading a stale file would prove nothing.
      - name: Emit JSON Schema
        run: npm run schema:emit

      - name: Fixtures validate in Python, and the schema still has teeth
        run: python scripts/validate_fixtures.py

      # The generation path runs against a fake client, so this needs no API key
      # and spends nothing. What it checks is the part that is ours: the schema we
      # send, the retry, the refusal handling, and that every composed layout
      # validates against the same artifact the renderer consumes.
      # Includes the cross-language patch conformance suite, which runs the same
      # patches through the TypeScript and Python appliers and asserts the results
      # are byte-identical. There are two implementations because the store
      # replays operations server-side; this is what keeps them from drifting.
      - name: API tests
        run: python -m pytest apps/api/tests -q -m 'not slow'

      # The agent system runs against the deterministic stub client, so it needs
      # no API key and spends nothing. What it checks is the part that is ours:
      # the routing, the envelope, the tool boundaries, the budgets and the
      # proposal lifecycle.
      - name: Agent tests
        run: python -m pytest agents -q

      # The launch surfaces: share links, quotas, the asset lifecycle and
      # themes. A gate rather than a nicety — a share link is a bearer
      # credential, and a mistake in one turns a private deck public silently.
      - name: Launch hardening tests
        run: python -m pytest apps/api/tests/test_launch.py -q

      # The models and the migration are two descriptions of one schema, so they
      # drift: someone adds a column, create_all() picks it up, every test passes,
      # and the deployed database is missing it.
      - name: Migrations match the models
        run: python -m pytest apps/api/tests/test_migrations.py -q

  # Export needs a browser and a Node subprocess, so it is its own job rather
  # than a dependency the schema-contract job carries for one test file.
  #
  # What it gates is the property that cannot be asserted from inside the
  # exporter: the artifacts open in readers that are not us. `python-pptx` and
  # `pypdf` are independent implementations of the same specifications, so a file
  # they refuse is a file PowerPoint or Acrobat refuses.
  export:
    name: Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: pip install -r requirements-dev.txt -r apps/api/requirements.txt pytest python-pptx pypdf

      - name: Worker browser measurement and editor scene parity
        run: npm run test:browser --workspace @deckastra/worker

      # The adapters themselves: OOXML structure, the relationship graph, the
      # degradation ledger and byte-stability. No browser needed.
      - name: Export adapter tests
        run: npm test --workspace @deckastra/export-pptx

      # End to end through the API, including a real Chromium PDF. Slow, and the
      # only place the whole path is exercised as a user would.
      - name: Export end to end
        run: python -m pytest apps/api/tests/test_exports.py apps/api/tests/test_pptx_opens.py -q

      # Every reviewed template, moved by its own motion style, exported to PDF
      # and PowerPoint and reopened by pypdf and python-pptx. Marked slow, so
      # this is the only CI job that runs it.
      - name: Every deck preset exports and reopens
        run: npm run presets:exports --workspace @deckastra/deck-presets

  # Recovery is a release control, not a paragraph in an operations document.
  # This job restores a complete PostgreSQL dump into a second database and
  # follows a known presentation through its historical version and S3 object.
  recovery-rehearsal:
    name: Database and asset restore rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements-dev.txt -r apps/api/requirements.txt

      - name: Start production-shaped persistence services
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml up -d --wait postgres minio
          docker compose -f infrastructure/docker/docker-compose.yml up --exit-code-from minio-init minio-init

      - name: Migrate source database
        env:
          DATABASE_URL: postgresql+psycopg://deckastra:deckastra_local@localhost:5432/deckastra
        run: python -m alembic -c infrastructure/database/alembic.ini upgrade head

      - name: Timed scratch restore
        env:
          DATABASE_URL: postgresql+psycopg://deckastra:deckastra_local@localhost:5432/deckastra
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY_ID: deckastra
          S3_SECRET_ACCESS_KEY: deckastra_local
          S3_ASSETS_BUCKET: deckastra-assets
        run: >-
          python scripts/restore_rehearsal.py
          --allow-sentinel-write
          --evidence .artifacts/release/restore-rehearsal.json

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-rehearsal
          path: .artifacts/release/restore-rehearsal.json
          if-no-files-found: error

      - name: Stop rehearsal services
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml down --volumes

  # ---------------------------------------------------------------- desktop
  #
  # The product is a Windows desktop app, and until this job existed nothing in
  # CI built it (final package review, item 10): a broken preload, a missing
  # PyInstaller import, a stale packaged worker or a failing installed smoke
  # step could not turn the build red. Everything here runs on the platform the
  # release ships for, because that is the only place those failures happen.
  #
  # Unsigned throughout. Signing and notarization are the release path (items
  # 11-13), which runs deliberately rather than on every push.
  desktop:
    name: Desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          # The version the dependency lock was resolved for.
          python-version: "3.13"

      - run: npm ci

      - name: Typecheck the desktop app
        run: npm run typecheck --workspace @deckastra/desktop

      - name: Desktop unit tests
        run: npm test --workspace @deckastra/desktop

      # Main, preload, renderer, exporter and MCP server. A preload that does
      # not build is a bridge that is simply absent at runtime.
      - name: Build the desktop bundles
        run: npm run build --workspace @deckastra/desktop

      # From the hashed lock, into a clean environment (item 09). This is also
      # what proves the lock installs on a machine that is not the author's.
      - name: Freeze the workspace service
        run: npm run build:sidecar --workspace @deckastra/desktop

      - name: Inventory and build identity
        run: |
          npm run sbom --workspace @deckastra/desktop
          npm run manifest --workspace @deckastra/desktop

      # The acceptance harness, on its own profile. These are the steps that
      # need no second display and no human: the app opens a deck, edits it,
      # finds the edit after a restart, renders the fixtures inside Electron's
      # own Chromium, and closes without losing unsaved work.
      - name: Acceptance steps
        shell: bash
        env:
          DECKASTRA_SMOKE_DIR: ${{ github.workspace }}/.artifacts/desktop
          DECKASTRA_SMOKE_PROFILE: ${{ github.workspace }}/.artifacts/desktop-profile
          DECKASTRA_SMOKE_FIXTURES: ${{ github.workspace }}/packages/presentation-schema/fixtures
          DECKASTRA_SMOKE_BASELINES: ${{ github.workspace }}/packages/renderer/baselines
          DECKASTRA_SIDECAR: ${{ github.workspace }}/apps/desktop/dist/sidecar/deckastra-service/deckastra-service.exe
        run: |
          mkdir -p "$DECKASTRA_SMOKE_DIR" "$DECKASTRA_SMOKE_PROFILE"
          cd apps/desktop
          for step in open edit verify digest close close-verify; do
            echo "--- $step"
            DECKASTRA_SMOKE_STEP=$step npx electron . || true
            node -e "
              const record = require(process.env.DECKASTRA_SMOKE_DIR + '/$step.json');
              // The close step hands the app to a real quit, so its own record
              // stays 'pending' by design; close-verify is where that is tested.
              const ok = record.ok === true || (record.step === 'close' && record.ok === 'pending');
              if (!ok) {
                console.error('$step failed:', record.error ?? record.ok);
                process.exit(1);
              }
              console.log('$step', record.ok);
            "
          done

      - name: Build an unsigned installer
        if: inputs.package
        run: npm run package --workspace @deckastra/desktop

      - name: Upload what the run produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-candidate
          path: |
            .artifacts/desktop
            apps/desktop/dist/build-manifest.json
            apps/desktop/dist/sbom.json
            apps/desktop/release/*.exe
          if-no-files-found: warn
