# Packaging.
#
# **Signing is configured and conditional, never assumed.** electron-builder
# signs when it finds credentials and quietly produces an unsigned artifact when
# it does not — which is the whole danger: an unsigned build looks exactly like a
# signed one until a user's machine refuses it. Nothing here can create a
# certificate, so the arrangement is that credentials come from the environment
# (`CSC_LINK` / `CSC_KEY_PASSWORD` on both platforms, `APPLE_ID` /
# `APPLE_APP_SPECIFIC_PASSWORD` / `APPLE_TEAM_ID` for notarization) and
# `scripts/check-signing.mjs` inspects the artifact afterwards rather than
# trusting the build. `DECKASTRA_RELEASE=1` turns "unsigned" from a report into
# a failure.
#
# What is **not** done and cannot be from here: no certificate exists, so no
# signed artifact has ever been produced or verified, and notarization has never
# been run. The configuration below is reviewed, not exercised.
appId: com.deckastra.desktop
# Pinned because npm workspaces hoist `electron` to the repo root, where
# electron-builder does not look — it probes `apps/desktop/node_modules` and
# concludes nothing is installed. Keep in step with the devDependency.
electronVersion: 44.4.3
productName: Deckastra
directories:
  output: release
  buildResources: build
# Only the built bundles. Everything else — workspace packages, node_modules,
# TypeScript source — is already inside them.
files:
  - dist/**/*
  - package.json
asar: true
# The workspace service, beside the app rather than inside the archive. An
# executable cannot be run from within an asar, and `sidecar.ts` looks for it at
# exactly this path.
extraResources:
  # What this build is: commit, dirty-tree hash, payload hashes and the
  # migrations digest the service is checked against (item 07). Written after
  # every payload exists, so it can name them.
  - from: dist/build-manifest.json
    to: build-manifest.json
  # What shipped, listed: the service's Python dependencies with the hashes pip
  # verified, and the npm packages the bundles were built from (item 09).
  - from: dist/sbom.json
    to: sbom.json
  # The licences of everything bundled (item 33), shown by Help > Third-party
  # notices, with the summary the release gate reconciles against.
  - from: dist/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: dist/notices.json
    to: notices.json
  - from: dist/sidecar/deckastra-service
    to: sidecar
  # The exporter, outside the archive as well. `ELECTRON_RUN_AS_NODE` does not
  # mount asar, so a worker inside it is a path the runtime cannot open — and the
  # export failed at "Rendering slides" with nothing saying why.
  - from: dist/worker
    to: worker
  # The MCP server, so an installed app can be driven by an agent without this
  # repository. Outside the archive for the same reason as the exporter: it runs
  # under `ELECTRON_RUN_AS_NODE`, which has no asar support.
  - from: dist/mcp
    to: mcp
win:
  # Project-owned multi-resolution Windows icon, derived from the adjacent
  # 1024px PNG source. Keeping the ICO in-tree makes Windows packaging
  # deterministic and avoids a network-only icon conversion toolchain.
  icon: build/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # Absent `CSC_LINK`, electron-builder skips signing and says so in its log.
  # `signAndEditExecutable` stays true so a configured certificate reaches the
  # nested executables too, not only the installer.
  signAndEditExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Notarization requires the hardened runtime, and the hardened runtime breaks
  # Electron and the PyInstaller sidecar without the entitlements beside this
  # file. See `build/entitlements.mac.plist` for why each one is there.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # **Every nested executable has to be signed, or notarization rejects the
  # whole bundle.** This app ships three that are not Electron's: the workspace
  # service, the exporter and the MCP server, all in `Contents/Resources` as
  # `extraResources`. They are named here so they are signed deliberately rather
  # than depending on electron-builder's guess about what is a binary — the
  # failure it produces otherwise is a notarization rejection days later, naming
  # a path rather than a cause.
  binaries:
    - Contents/Resources/sidecar/deckastra-service
  # Off in the file, deliberately. A config that says it notarizes on a machine
  # with no Apple credentials produces an unnotarized build and a green log, and
  # the first person to find out is a user whose Mac refuses to open it. A
  # release turns it on explicitly, once the credentials are actually present:
  #
  #   APPLE_ID=... APPLE_APP_SPECIFIC_PASSWORD=... APPLE_TEAM_ID=...   #     npx electron-builder --mac --config.mac.notarize=true --publish never
  #
  # then `npm run verify:signing`, which reads the artifact rather than the log.
  notarize: false
