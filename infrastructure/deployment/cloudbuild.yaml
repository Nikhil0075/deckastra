steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-c', 'docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/deckastra/api:${_CACHE_TAG} || true']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--cache-from', '${_REGION}-docker.pkg.dev/$PROJECT_ID/deckastra/api:${_CACHE_TAG}', '-f', 'infrastructure/deployment/docker/api.Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/deckastra/api:${_TAG}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'infrastructure/deployment/docker/export-worker.Dockerfile', '--build-arg', 'API_IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/deckastra/api:${_TAG}', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/deckastra/export-worker:${_TAG}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'infrastructure/deployment/docker/migrate.Dockerfile', '--build-arg', 'API_IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/deckastra/api:${_TAG}', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/deckastra/migrate:${_TAG}', '.']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/deckastra/api:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/deckastra/export-worker:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/deckastra/migrate:${_TAG}'
substitutions:
  _REGION: asia-south1
  _TAG: dev
  _CACHE_TAG: dev
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
